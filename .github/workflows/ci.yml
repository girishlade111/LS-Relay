name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: ls-ship

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ls-ship/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Build with throwaway credentials — the app never connects to real
      # services at build time, but module-level env validation requires the
      # variables to exist.
      - name: Build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder_key_for_build_only
          CLERK_SECRET_KEY: sk_test_ci_placeholder_secret_for_build_only
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: |
          # 32 raw bytes, base64-encoded — exactly what lib/crypto expects.
          ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          export ENCRYPTION_KEY
          npm run build
